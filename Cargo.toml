[package]
name = "display-widget"
version = "0.1.0"
edition = "2024"
description = "Monitor control widget for Ubuntu/Linux: DDC/CI image controls + GNOME display layout"
repository = "https://github.com/sarvkk/AcerDisplay"
license = "MIT"

[dependencies]
ddc = "0.2"
ddc-hi = { version = "0.4", default-features = false }
ddc-i2c = { version = "0.2", default-features = false, features = ["with-linux"] }
eframe = "0.31"
env_logger = "0.11"
log = "0.4"
mccs = "0.1"
mccs-caps = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"

[profile.release]
strip = true
lto = "thin"
